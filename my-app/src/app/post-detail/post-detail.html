<div class="row justify-content-center">
  <div class="col-lg-8">
    <div *ngIf="post; else notFound">
      <nav aria-label="breadcrumb" class="mb-4">
        <ol class="breadcrumb">
          <li class="breadcrumb-item">
            <a routerLink="/posts"><i class="fas fa-home me-1"></i>Home</a>
          </li>
          <li class="breadcrumb-item active">{{ post.title }}</li>
        </ol>
      </nav>

      <div class="card shadow">
        <div class="card-header bg-primary text-white">
          <h1 class="card-title h3 mb-2">{{ post.title }}</h1>
          <small><i class="fas fa-user me-1"></i>{{ post.author }} · {{ formatDate(post.date) }}</small>
        </div>
        <div class="card-body">
          <p class="lead">{{ post.content }}</p>
        </div>
        <div class="card-footer bg-light d-flex justify-content-between">
          <button (click)="goBack()" class="btn btn-secondary">⬅️ Indietro</button>
          <button (click)="deletePost()" class="btn btn-danger">🗑️ Elimina</button>
        </div>
      </div>
    </div>

    <ng-template #notFound>
      <h2>Post non trovato</h2>
      <a routerLink="/posts" class="btn btn-primary">Torna alla Home</a>
    </ng-template>
  </div>
</div>
